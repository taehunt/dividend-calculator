name: Blog Draft Generator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publishing mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - backfill
permissions:
  contents: read

concurrency:
  group: yieldgrower-blog-draft
  cancel-in-progress: false

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          requests==2.32.5
          google-auth==2.56.2

      - name: Verify calculator example
        run: python bots/blog/generate_post.py --check

      - name: Generate bilingual draft for editorial review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.5-flash
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: sc-domain:yieldgrower.com
        run: |
          if [[ "${{ inputs.mode }}" == "backfill" || "${{ github.event.head_commit.message }}" == *"[backfill]"* ]]; then
            python bots/blog/generate_post.py --backfill-all
          else
            python bots/blog/generate_post.py
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Build site with generated draft
        run: npm run build

      - name: Collect generated draft
        run: |
          mkdir -p editorial-draft
          git status --porcelain -- posts | cut -c4- | while IFS= read -r file; do
            if [[ -n "$file" ]]; then
              cp --parents "$file" editorial-draft/
            fi
          done

      - name: Upload draft for manual review
        uses: actions/upload-artifact@v4
        with:
          name: yieldgrower-editorial-draft
          path: editorial-draft/
          if-no-files-found: warn
