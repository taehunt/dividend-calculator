name: Daily Quality Blog Publisher

on:
  schedule:
    # Every day at 08:00 Asia/Seoul (23:00 UTC).
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Publishing mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - backfill
  push:
    branches:
      - main
    paths:
      - ".github/workflows/blog-bot.yml"
      - "bots/blog/**"

permissions:
  contents: write

concurrency:
  group: yieldgrower-daily-blog
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Verify calculator example
        run: python bots/blog/generate_post.py --check

      - name: Generate quality-gated bilingual article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.5-flash
        run: |
          if [[ "${{ inputs.mode }}" == "backfill" || "${{ github.event.head_commit.message }}" == *"[backfill]"* ]]; then
            python bots/blog/generate_post.py --backfill-all
          else
            python bots/blog/generate_post.py
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Build site with generated article
        run: npm run build

      - name: Commit and push if posts changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          if git diff --staged --quiet; then
            echo "No new post to publish"
            exit 0
          fi
          if [[ "${{ inputs.mode }}" == "backfill" || "${{ github.event.head_commit.message }}" == *"[backfill]"* ]]; then
            git commit -m "Expand legacy dividend guides"
          else
            git commit -m "Publish daily quality blog post"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
