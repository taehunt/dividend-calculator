name: Pinterest Auto Posting Bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render and validate without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: yieldgrower-pinterest
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          Pillow==11.3.0 requests==2.32.5

      - name: Render and validate pin
        run: python bots/pinterest/pin.py --dry-run

      - name: Publish pin
        if: ${{ !inputs.dry_run }}
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python bots/pinterest/pin.py

      - name: Upload preview
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yieldgrower-pinterest-preview
          path: pinterest_pin.jpg
          if-no-files-found: error
