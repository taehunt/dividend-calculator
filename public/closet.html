<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f9f6">
<title>내 옷장 - 코디룸</title>
<link rel="stylesheet" href="./closet/room.css">
<script type="module" src="./closet/room.js"></script>
</head>
<body>
<header><div class="header-inner"><div class="brand"><span class="brand-icon" aria-hidden="true">♧</span>코디룸</div><span class="device">이 브라우저의 개인 옷장</span></div></header>
<main>
<section class="studio" aria-label="착장 미리보기">
<div class="studio-bar"><h1>피팅룸</h1><span id="count">착용 0개</span></div>
<div class="stage"><div class="figure"><canvas id="form" width="400" height="760" aria-label="정면 마네킹"></canvas><div id="layers"></div></div></div>
<div class="caption" id="look">선택한 옷이 여기에 표시돼요.</div>
</section>
<section class="closet" aria-labelledby="closetTitle">
<div class="closet-head"><h2 id="closetTitle">내 옷장</h2><label class="upload" for="files"><span aria-hidden="true">+</span> 옷 사진 추가<input type="file" accept="image/*" id="files" multiple></label></div>
<div id="tabs" aria-label="옷 종류"></div>
<h3><span id="categoryName"></span> <small id="total"></small></h3>
<div id="items"></div>
<div id="empty"><strong>아직 등록한 옷이 없어요</strong><p>한 벌씩 펼쳐 찍은 사진을 추가해 보세요.<br>배경을 지우고 종류별로 정리해요.</p></div>
<p role="status" id="status" aria-live="polite"></p>
<div id="tools" hidden><label>분류 수정 <select id="move"></select></label><button id="remove" type="button">옷 삭제</button></div>
</section>
</main>
</body>
</html>
